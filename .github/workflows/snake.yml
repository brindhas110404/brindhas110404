name: Update contribution snake

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate blue and violet SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: brindhas110404
          outputs: |
            dist/github-snake.svg?color_snake=#6d28d9&color_dots=#ebf2ff,#c7d2fe,#93c5fd,#6366f1,#5b21b6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#a78bfa&color_dots=#0d1117,#1e3a8a,#3b82f6,#818cf8,#a78bfa

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
