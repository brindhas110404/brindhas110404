<svg xmlns="http://www.w3.org/2000/svg" width="900" height="54" viewBox="0 0 900 54" role="img" aria-label="Legend: darker to brighter green means more contributions that day. The snake image is regenerated daily by a GitHub Action.">
<style>
.m { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
.led { animation: led 1.6s ease-in-out infinite; }
@keyframes led { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
.cur { animation: cur 1s steps(1) infinite; }
@keyframes cur { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }

.sq { opacity: 0; animation: pop .5s ease-out forwards; transform-box: fill-box; transform-origin: center; }
@keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
.scan { animation: scan 3.2s ease-in-out infinite; }
@keyframes scan { 0% { transform: translateX(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(96px); opacity: 0; } }
</style>
<rect x="1" y="1" width="898" height="52" rx="10" fill="#0b0f19" stroke="#232b3d" stroke-width="1.2"/>
<text class="m" x="22" y="32" font-size="12" fill="#6e7891">less</text>
<rect class="sq" style="animation-delay:0.00s" x="62" y="20" width="14" height="14" rx="3" fill="#161b26"/><rect class="sq" style="animation-delay:0.15s" x="82" y="20" width="14" height="14" rx="3" fill="#0e4429"/><rect class="sq" style="animation-delay:0.30s" x="102" y="20" width="14" height="14" rx="3" fill="#006d32"/><rect class="sq" style="animation-delay:0.45s" x="122" y="20" width="14" height="14" rx="3" fill="#26a641"/><rect class="sq" style="animation-delay:0.60s" x="142" y="20" width="14" height="14" rx="3" fill="#39d353"/>
<rect class="scan" x="60" y="18" width="4" height="18" rx="2" fill="#3fb950" opacity="0"/>
<text class="m" x="168" y="32" font-size="12" fill="#6e7891">more</text>
<line x1="222" y1="14" x2="222" y2="40" stroke="#232b3d"/>
<text class="m" x="242" y="32" font-size="12" fill="#c9d1d9">1 square = 1 day · the snake eats every day I shipped code</text>
<circle class="led" cx="716" cy="27" r="4.5" fill="#3fb950"/>
<text class="m" x="728" y="32" font-size="12" fill="#3fb950" font-weight="700">cron</text>
<text class="m" x="766" y="32" font-size="12" fill="#6e7891">0 0 * * *</text>
</svg>