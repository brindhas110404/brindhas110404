.cur { animation: cur 1s steps(1) infinite; }
@keyframes cur { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }

.row { opacity: 0; animation: rin .6s ease-out forwards; }
@keyframes rin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
