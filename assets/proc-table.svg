<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Right now: building MedRec with Stony Brook Hospital at IRS Labs; teaching assistant for CSE 581; profiling GPT-2 training with bf16, FlashAttention, Nsight Systems and a fused CUDA kernel.">
<style>
.m { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
.led { animation: led 1.6s ease-in-out infinite; }
